appId: org.courtplus.desktop
productName: CourtPlus
directories:
  output: release
npmRebuild: false
files:
  - dist/**/*
  - resources/shell/**/*
  - "!**/better-sqlite3-multiple-ciphers/deps/**"
  - "!**/better-sqlite3-multiple-ciphers/prebuilds/!(win32-x64.node)"
  - "!**/onnxruntime-node/bin/napi-v*/{darwin,linux}/**"
  - "!**/onnxruntime-node/bin/napi-v*/win32/!(x64)/**"
  - "!**/onnxruntime-web/dist/!(ort.node.min.js|ort.node.min.mjs|ort-wasm-simd-threaded.mjs|ort-wasm-simd-threaded.wasm|ort-wasm-simd-threaded.jsep.mjs|ort-wasm-simd-threaded.jsep.wasm)"
asarUnpack:
  - "**/*.node"
  - "**/onnxruntime-node/bin/napi-v*/win32/x64/**/*"
  - "**/onnxruntime-web/dist/*.wasm"
  - "**/onnxruntime-web/dist/*.mjs"
  - "**/tesseract.js/src/**/*"
  - "**/tesseract.js-core/**/*"
  - "**/@courtplus/intake/assets/tessdata/**/*"
extraResources:
  - from: resources
    to: .
    filter:
      - "diag/**/*"
      - "ui/**/*"
      - "model/**/*"
      - "data/**/*"
      - "assets/**/*"
      - "templates/**/*"
win:
  signAndEditExecutable: false
  target:
    - target: portable
      arch: [x64]
    - target: dir
      arch: [x64]
portable:
  artifactName: "CourtPlus-${version}-${arch}-portable.${ext}"

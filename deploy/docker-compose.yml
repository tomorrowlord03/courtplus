services:
  cloud:
    image: courtplus-cloud:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./chromium-seccomp.json
    mem_limit: 640m
    cpus: 1.0
    restart: unless-stopped
    environment:
      APP_ORIGIN: "https://${COURTPLUS_SITE:-localhost}"
      COURTPLUS_DB_PATH: /var/lib/courtplus/courtplus.sqlite3
      COURTPLUS_EVIDENCE_DIR: /var/lib/courtplus/evidence
      COURTPLUS_HANDOFF_MINUTES: "${COURTPLUS_HANDOFF_MINUTES:-60}"
      COURTPLUS_EVIDENCE_KEY_FILE: /run/secrets/evidence_key
      COURTPLUS_SIGNING_KEY_FILE: /run/secrets/signing_key
    secrets:
      - db_key
      - evidence_key
      - signing_key
    volumes:
      - courtplus_db:/var/lib/courtplus
      - courtplus_evidence:/var/lib/courtplus/evidence
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks: [backend]

  caddy:
    image: caddy:2-alpine
    depends_on:
      cloud:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25
    restart: unless-stopped
    environment:
      COURTPLUS_SITE: "${COURTPLUS_SITE:-localhost}"
    ports:
      - "${COURTPLUS_BIND:-127.0.0.1}:80:80"
      - "${COURTPLUS_BIND:-127.0.0.1}:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks: [backend, edge]

networks:
  backend:
    internal: true
  edge:

volumes:
  courtplus_db:
  courtplus_evidence:
  caddy_data:
  caddy_config:

secrets:
  db_key:
    file: "${COURTPLUS_DB_KEY_FILE:-./secrets/db_key}"
  evidence_key:
    file: "${COURTPLUS_EVIDENCE_KEY_SOURCE:-./secrets/evidence_key}"
  signing_key:
    file: "${COURTPLUS_SIGNING_KEY_SOURCE:-./secrets/signing_key}"
